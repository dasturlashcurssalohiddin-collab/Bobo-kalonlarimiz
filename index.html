<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Ariza Formasi | Index</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:#f0f4f7;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;}
.container{background:white;padding:30px 25px;border-radius:15px;width:100%;max-width:500px;box-shadow:0 10px 25px rgba(0,0,0,0.15);}
h2{text-align:center;margin-bottom:20px;color:#333;}
input,textarea,select,button{width:100%;padding:10px;margin:5px 0 15px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box;}
button{background:#667eea;color:white;border:none;font-weight:bold;cursor:pointer;}
button:hover{background:#5a67d8;}
.checkbox-group label{display:block;margin:3px 0;}
.success{color:green;text-align:center;font-weight:bold;margin-top:10px;}
</style>
</head>
<body>
<div class="container">
<h2>Ariza Formasi</h2>
<form id="form">
<label>F.I.SH:</label>
<input type="text" id="name" placeholder="Ism Familiya">

<label>Tug‘ilgan sana:</label>
<div style="display:flex;gap:10px;">
<input type="number" id="day" placeholder="Kun" min="1" max="31">
<input type="number" id="month" placeholder="Oy" min="1" max="12">
<input type="number" id="year" placeholder="Yil" min="1900" max="2026">
</div>

<label>Hobbi (bir yoki bir nechta tanlang):</label>
<div class="checkbox-group">
<label><input type="checkbox" name="hobby" value="Kitob o‘qish"> Kitob o‘qish</label>
<label><input type="checkbox" name="hobby" value="Sport"> Sport</label>
<label><input type="checkbox" name="hobby" value="Musiqa"> Musiqa</label>
<label><input type="checkbox" name="hobby" value="Sayohat"> Sayohat</label>
</div>

<label>Qo‘shimcha ma’lumot:</label>
<textarea id="extra" placeholder="Istalgan qo‘shimcha ma’lumot"></textarea>

<button type="submit">Saqlash va Bobo-Kalonlar.html ga o'tish</button>
<div id="success" class="success"></div>
</form>
</div>

<script>
// Form elementlarini olish
const form = document.getElementById("form");

// Validatsiya funksiyasi
function validate(data){
    if(!data.name){alert("Ism kiritilishi shart!"); return false;}
    if(data.day<1||data.day>31||data.month<1||data.month>12||data.year<1900){alert("Sana noto‘g‘ri!"); return false;}
    if(data.hobbies.length===0){alert("Hobbi tanlanmagan!"); return false;}
    return true;
}

// Form yuborilishi
form.addEventListener("submit", e=>{
    e.preventDefault();

    const data = {
        name: document.getElementById("name").value.trim(),
        day: parseInt(document.getElementById("day").value),
        month: parseInt(document.getElementById("month").value),
        year: parseInt(document.getElementById("year").value),
        hobbies: Array.from(document.querySelectorAll("input[name='hobby']:checked")).map(i=>i.value),
        extra: document.getElementById("extra").value.trim()
    };

    if(!validate(data)) return;

    // Ma'lumotni localStorage ga saqlash
    localStorage.setItem("arizaData", JSON.stringify(data));

    document.getElementById("success").innerText="Ma’lumot saqlandi! 1 soniyadan keyin Bobo-Kalonlar.html ga yo‘naltiriladi...";

    // Bobo-Kalonlar.html ga yo‘naltirish
    setTimeout(()=>{window.location.href="bobo-kalonlar.html";},1000);
});
</script>
</body>
</html>
