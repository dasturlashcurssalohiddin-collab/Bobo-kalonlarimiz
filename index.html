<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Ariza Formasi</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
<style>
body { font-family: sans-serif; padding: 20px; background: #f0f8ff; }
form { display: flex; flex-direction: column; width: 300px; gap: 10px; margin-top: 20px; }
input { padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
button { padding: 10px; border:none; border-radius: 5px; background: #4CAF50; color: white; cursor: pointer; }
button:hover { background: #45a049; }
</style>
</head>
<body>

<h2>Google orqali kirish</h2>
<div id="gSignIn"></div>

<form id="form" style="display:none;">
<input type="text" id="name" placeholder="Ism" required>
<input type="text" id="city" placeholder="Shahar" required>
<input type="text" id="phone" placeholder="Telefon" required>
<input type="text" id="email" placeholder="Email" readonly required>
<button type="submit">Yuborish</button>
</form>

<script>
const CLIENT_ID = "318653553640-uv3r040c4im18no4mjeq8eeomj24b1o8.apps.googleusercontent.com";
const API_URL = "https://bobo-kalonlarimiz-haqida.onrender.com/send"; // Render.com server

function handleCredentialResponse(res){
   const data = jwt_decode(res.credential);
   document.getElementById("form").style.display = "block";
   document.getElementById("email").value = data.email;
}

window.onload = () => {
   google.accounts.id.initialize({
       client_id: CLIENT_ID,
       callback: handleCredentialResponse
   });

   google.accounts.id.renderButton(
       document.getElementById("gSignIn"),
       { size: "large" }
   );
};

// FORM SUBMIT
document.getElementById("form").addEventListener("submit", async (e)=>{
   e.preventDefault();

   const data = {
       name: document.getElementById("name").value,
       city: document.getElementById("city").value,
       phone: document.getElementById("phone").value,
       email: document.getElementById("email").value
   };

   try {
       const res = await fetch(API_URL,{
           method:"POST",
           headers:{"Content-Type":"application/json"},
           body:JSON.stringify(data)
       });

       const text = await res.text();
       let result;
       try { result = JSON.parse(text); } 
       catch(err) { alert("Serverdan noto‘g‘ri javob keldi"); return; }

       if(result.success){
           alert("Yuborildi!");
           window.location.href = "bobo-kalonlar.html";
       } else {
           alert("Xatolik: " + (result.error || "Server xatosi"));
       }

   } catch(err){
       console.error(err);
       alert("Serverga ulanishda xatolik");
   }
});
</script>

</body>
</html>
