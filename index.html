<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ariza Formasi</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family: Arial, sans-serif; background:#f5f5f5; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; padding:20px; }
.container { width:100%; max-width:400px; }
h2 { text-align:center; color:#333; margin-bottom:20px; }
form { display:flex; flex-direction:column; gap:12px; background:#fff; padding:20px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
input { padding:12px; font-size:16px; border-radius:8px; border:1px solid #ccc; }
input[readonly] { background:#e9e9e9; }
button { padding:12px; font-size:16px; border-radius:8px; border:none; background-color:#4285F4; color:white; cursor:pointer; transition:0.3s; }
button:hover { background-color:#357ae8; }
#gSignIn { display:flex; justify-content:center; margin-bottom:20px; }
@media(max-width:480px){ form { padding:15px; } input, button { font-size:14px; padding:10px; } }
</style>
</head>
<body>

<div class="container">
<h2>Google orqali kirish</h2>
<div id="gSignIn"></div>

<form id="form" style="display:none;">
<input type="text" id="name" placeholder="Ism" required>
<input type="text" id="city" placeholder="Shahar" required>
<input type="text" id="phone" placeholder="Telefon" required>
<input type="text" id="email" readonly required>
<button type="submit">Yuborish</button>
</form>
</div>

<script>
// Google Client ID va backend URL
const CLIENT_ID = "318653553640-uv3r040c4im18no4mjeq8eeomj24b1o8.apps.googleusercontent.com";
const API_URL = "https://bobo-kalonlarimiz-haqida.onrender.com/send"; // /send endpoint to'g'ri yozilgan

// Google Login Callback
function handleCredentialResponse(res){
   const data = jwt_decode(res.credential);
   document.getElementById("form").style.display = "block";
   document.getElementById("email").value = data.email;
}

// Google button render
window.onload = () => {
   google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleCredentialResponse });
   google.accounts.id.renderButton(document.getElementById("gSignIn"), { size: "large" });
};

// Form submit
document.getElementById("form").addEventListener("submit", async (e)=>{
   e.preventDefault();

   const data = {
       name: document.getElementById("name").value,
       city: document.getElementById("city").value,
       phone: document.getElementById("phone").value,
       email: document.getElementById("email").value
   };

   try {
       const res = await fetch(API_URL,{
           method:"POST",
           headers:{"Content-Type":"application/json"},
           body:JSON.stringify(data)
       });

       const text = await res.text();
       let result;
       try { result = JSON.parse(text); } 
       catch(err){ 
           console.error("JSON parse xatosi:", text); 
           alert("Serverdan noto‘g‘ri javob keldi"); 
           return; 
       }

       if(result.success){
           alert("Yuborildi!");
           window.location.href = "bobo-kalonlar.html";
       } else {
           alert("Xatolik!");
       }

   } catch(err) {
       alert("Serverga ulanishda xatolik: " + err);
   }
});
</script>

</body>
</html>
