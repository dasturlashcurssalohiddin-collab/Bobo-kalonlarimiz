<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Ariza Formasi</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
</head>
<style>
body { font-family: Arial; background:#f5f5f5; display:flex; flex-direction:column; align-items:center; padding:50px; }
h2 { color:#333; }
form { display:flex; flex-direction:column; gap:10px; margin-top:20px; background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); width:300px;}
input { padding:10px; font-size:14px; border-radius:5px; border:1px solid #ccc;}
button { padding:10px; font-size:16px; border-radius:5px; border:none; background-color:#4285F4; color:white; cursor:pointer;}
button:hover{background-color:#357ae8;}
</style>


<body>


<h2>Google orqali kirish</h2>
<div id="gSignIn"></div>


<form id="form" style="display:none;">
<input type="text" id="name" placeholder="Ism">
<input type="text" id="city" placeholder="Shahar">
<input type="text" id="phone" placeholder="Telefon">
<input type="text" id="email" readonly>
<button type="submit">Yuborish</button>
</form>


<script>
const CLIENT_ID = "318653553640-uv3r040c4im18no4mjeq8eeomj24b1o8.apps.googleusercontent.com";
const API_URL = "https://bobo-kalonlarimiz-haqida.onrender.com/send";


function handleCredentialResponse(res){
   const data = jwt_decode(res.credential);


   document.getElementById("form").style.display = "block";
   document.getElementById("email").value = data.email;
}


window.onload = () => {
   google.accounts.id.initialize({
       client_id: CLIENT_ID,
       callback: handleCredentialResponse
   });


   google.accounts.id.renderButton(
       document.getElementById("gSignIn"),
       { size: "large" }
   );
};


// FORM SUBMIT
document.getElementById("form").addEventListener("submit", async (e)=>{
   e.preventDefault();


   const data = {
       name: document.getElementById("name").value,
       city: document.getElementById("city").value,
       phone: document.getElementById("phone").value,
       email: document.getElementById("email").value
   };


   const res = await fetch(API_URL,{
       method:"POST",
       headers:{"Content-Type":"application/json"},
       body:JSON.stringify(data)
   });


   const result = await res.json();


   if(result.success){
       alert("Yuborildi!");
       window.location.href = "bobo-kalonlar.html";
   }else{
       alert("Xatolik!");
   }
});
</script>


</body>
</html>
