<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Bobokalon — BIU</title>
  <meta name="description" content="Buyuk shaxs haqida to'liq ma'lumot" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='50' font-size='80' dominant-baseline='middle' text-anchor='middle'%3E🏛️%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── PAGE-LEVEL TOKENS ── */
    :root {
      --accent-gold: #f4e27a;
      --accent-gold-dim: rgba(244,226,122,0.14);
      --ink: rgba(240,246,255,0.82);
      --section-bg: rgba(8,20,40,0.78);
      --radius: 20px;
    }

    /* ── VIDEO BG ── */
    #bg-video {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: -1;
      opacity: 0.38;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      min-height: 94vh;
      display: flex;
      align-items: flex-end;
      padding: 0 0 72px;
      overflow: hidden;
    }

    .hero-img {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center top;
      transform: scale(1.06);
      transition: transform 8s ease;
      filter: brightness(0.52) saturate(1.2);
    }

    .hero:hover .hero-img { transform: scale(1); }

    .hero-overlay {
      position: absolute; inset: 0;
      background:
        linear-gradient(to top,  rgba(4,10,22,0.98) 0%, rgba(4,10,22,0.55) 40%, transparent 75%),
        linear-gradient(to right, rgba(4,10,22,0.75) 0%, transparent 60%);
    }

    .hero-content {
      position: relative; z-index: 2;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
      width: 100%;
    }

    .hero-eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero-eyebrow::before {
      content: '';
      display: inline-block;
      width: 40px; height: 2px;
      background: var(--primary);
      box-shadow: 0 0 10px rgba(106,216,255,0.6);
    }

    .hero-name {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 0%, var(--accent-gold) 55%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glow 4s ease-in-out infinite;
    }

    .hero-dates {
      font-size: 18px;
      color: rgba(240,246,255,0.65);
      margin-bottom: 28px;
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    .hero-tags {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .hero-tag {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 50px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--primary);
      background: rgba(106,216,255,0.08);
      backdrop-filter: blur(8px);
    }

    .hero-stats {
      display: flex; gap: 36px; flex-wrap: wrap;
    }

    .hero-stat { text-align: left; }

    .hero-stat-val {
      font-family: 'Cinzel', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--accent-gold);
      line-height: 1;
      text-shadow: 0 0 20px rgba(244,226,122,0.45);
    }

    .hero-stat-label {
      font-size: 11px;
      color: rgba(240,246,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 5px;
    }

    .scroll-cue {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      color: rgba(255,255,255,0.35);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      animation: pulse 2s ease-in-out infinite;
      z-index: 2;
    }

    .scroll-cue::after {
      content: '';
      width: 1px; height: 50px;
      background: linear-gradient(to bottom, rgba(106,216,255,0.6), transparent);
    }

    /* ── BACK NAV ── */
    .back-nav {
      position: fixed;
      top: 20px; left: 24px;
      z-index: 500;
    }

    .back-nav a {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 18px;
      background: rgba(4,10,22,0.82);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 50px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
    }

    .back-nav a:hover {
      border-color: var(--primary);
      background: var(--primary-dim);
      transform: translateX(-4px);
    }

    /* ── MAIN CONTENT ── */
    .content-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px 100px;
    }

    /* ── SECTION BASE ── */
    .section {
      margin-bottom: 72px;
      animation: pageFadeUp 0.6s ease both;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 36px;
    }

    .section-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(106,216,255,0.18), rgba(0,212,255,0.08));
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--light);
      letter-spacing: 0.04em;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--border-mid), transparent);
    }

    /* ── BIO CARD ── */
    .bio-card {
      background: var(--section-bg);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      line-height: 1.95;
      font-size: 16px;
      color: var(--ink);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .bio-card::before {
      content: '"';
      font-family: 'Cinzel', serif;
      font-size: 220px;
      color: rgba(106,216,255,0.04);
      position: absolute;
      top: -30px; left: 20px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .bio-card p { margin-bottom: 20px; text-align: justify; }

    /* ── QUOTES ── */
    .quotes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 22px;
    }

    .quote-card {
      background: var(--accent-gold-dim);
      border: 1px solid rgba(244,226,122,0.22);
      border-left: 4px solid var(--accent-gold);
      border-radius: 16px;
      padding: 28px 26px;
      transition: var(--transition);
      position: relative;
    }

    .quote-card:hover {
      transform: translateY(-6px);
      border-color: rgba(244,226,122,0.55);
      box-shadow: 0 12px 36px rgba(244,226,122,0.15);
    }

    .quote-text {
      font-style: italic;
      color: var(--accent-gold);
      font-size: 15.5px;
      line-height: 1.75;
      margin-bottom: 14px;
    }

    .quote-text::before { content: '"'; font-size: 1.4em; }
    .quote-text::after  { content: '"'; font-size: 1.4em; }

    .quote-source {
      font-size: 12px;
      color: rgba(244,226,122,0.55);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── WORKS ── */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .work-card {
      background: var(--section-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: var(--transition);
      cursor: default;
    }

    .work-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--border-hi);
      box-shadow: var(--shadow), var(--glow-sm);
    }

    .work-icon {
      font-size: 32px;
      margin-bottom: 14px;
    }

    .work-title {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-gold);
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }

    .work-year {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    .work-desc {
      font-size: 13px;
      color: var(--ink);
      line-height: 1.6;
    }

    /* ── TIMELINE ── */
    .tl-wrap {
      position: relative;
      padding-left: 40px;
    }

    .tl-wrap::before {
      content: '';
      position: absolute;
      left: 10px; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--primary), rgba(106,216,255,0.1));
      box-shadow: 0 0 12px rgba(106,216,255,0.3);
    }

    .tl-item {
      position: relative;
      margin-bottom: 36px;
      animation: slideUp 0.5s ease both;
    }

    .tl-dot {
      position: absolute;
      left: -36px; top: 6px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: 3px solid var(--dark-1);
      box-shadow: 0 0 14px rgba(106,216,255,0.65);
      transition: var(--transition);
    }

    .tl-item:hover .tl-dot {
      transform: scale(1.4);
      box-shadow: 0 0 24px rgba(106,216,255,0.9);
    }

    .tl-year {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.1em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .tl-box {
      background: var(--section-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      transition: var(--transition);
    }

    .tl-item:hover .tl-box {
      border-color: var(--border-mid);
      background: rgba(8,20,40,0.92);
      transform: translateX(6px);
    }

    .tl-event {
      font-weight: 600;
      color: var(--accent-gold);
      font-size: 15px;
      margin-bottom: 6px;
    }

    .tl-detail {
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.6;
    }

    /* ── AI CHATBOT ── */
    .chat-section {
      background: var(--section-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .chat-header {
      padding: 20px 28px;
      background: linear-gradient(135deg, rgba(106,216,255,0.12), rgba(0,212,255,0.06));
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .chat-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(106,216,255,0.4);
    }

    .chat-header-info { flex: 1; }

    .chat-name {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 0.04em;
    }

    .chat-status {
      font-size: 11px;
      color: var(--success);
      display: flex; align-items: center; gap: 5px;
      margin-top: 3px;
    }

    .chat-status::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .chat-messages {
      height: 420px;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--border-mid);
      border-radius: 4px;
    }

    .msg {
      max-width: 78%;
      animation: fadeInScale 0.3s ease;
    }

    .msg-bot  { align-self: flex-start; }
    .msg-user { align-self: flex-end; }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
    }

    .msg-bot  .msg-bubble {
      background: rgba(106,216,255,0.1);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--ink);
    }

    .msg-user .msg-bubble {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: var(--dark-1);
      font-weight: 600;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      color: var(--muted);
      margin-top: 5px;
      letter-spacing: 0.05em;
    }

    .msg-bot  .msg-time { text-align: left; }
    .msg-user .msg-time { text-align: right; }

    .msg-typing .msg-bubble {
      display: flex; gap: 5px; align-items: center;
      padding: 16px 20px;
    }

    .dot-typing {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--primary);
      animation: bounce 1.2s infinite;
    }
    .dot-typing:nth-child(2) { animation-delay: 0.2s; }
    .dot-typing:nth-child(3) { animation-delay: 0.4s; }

    .quick-prompts {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 14px 24px;
      border-top: 1px solid var(--border);
    }

    .qp-btn {
      padding: 7px 14px;
      background: rgba(106,216,255,0.07);
      border: 1px solid var(--border);
      border-radius: 50px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .qp-btn:hover {
      background: var(--primary);
      color: var(--dark-1);
      border-color: transparent;
    }

    .chat-input-row {
      display: flex;
      gap: 12px;
      padding: 18px 24px;
      border-top: 1px solid var(--border);
      align-items: flex-end;
    }

    #chatInput {
      flex: 1;
      padding: 13px 18px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--light);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      resize: none;
      min-height: 48px;
      max-height: 130px;
      transition: var(--transition);
      line-height: 1.55;
    }

    #chatInput::placeholder { color: var(--muted); }

    #chatInput:focus {
      border-color: var(--primary);
      background: rgba(106,216,255,0.05);
      box-shadow: 0 0 16px rgba(106,216,255,0.25);
    }

    .send-btn {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      color: var(--dark-1);
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(106,216,255,0.35);
    }

    .send-btn:hover {
      transform: scale(1.1) rotate(-8deg);
      box-shadow: var(--glow-lg);
    }

    .send-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    /* ── RELATED ── */
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .rel-card {
      background: var(--section-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: var(--transition);
      cursor: pointer;
      text-decoration: none;
    }

    .rel-card:hover {
      transform: translateY(-8px);
      border-color: var(--border-hi);
      box-shadow: var(--shadow), var(--glow-sm);
    }

    .rel-card img {
      width: 100%; height: 140px;
      object-fit: cover;
      filter: brightness(0.82) saturate(1.1);
      transition: transform 0.4s ease;
    }

    .rel-card:hover img { transform: scale(1.1); }

    .rel-info {
      padding: 14px 16px;
    }

    .rel-name {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    .rel-cat {
      font-size: 11px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── ERROR STATE ── */
    .error-state {
      text-align: center;
      padding: 80px 30px;
      color: var(--muted);
    }
    .error-state .icon { font-size: 64px; margin-bottom: 20px; }
    .error-state h2 { color: var(--primary); margin-bottom: 12px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .hero { min-height: 85vh; }
      .hero-content { padding: 0 22px; }
      .hero-name { font-size: 2.4rem; }
      .hero-stats { gap: 22px; }
      .content-wrap { padding: 0 18px 80px; }
      .bio-card, .chat-section { padding: 0; }
      .bio-card { padding: 26px 22px; }
      .quotes-grid { grid-template-columns: 1fr; }
      .works-grid  { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
      .chat-messages { height: 320px; }
    }

    @media (max-width: 480px) {
      .hero-name { font-size: 1.9rem; }
      .hero-stats { flex-wrap: wrap; gap: 16px; }
      .hero-stat-val { font-size: 1.8rem; }
      .works-grid  { grid-template-columns: 1fr 1fr; }
      .related-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

/* ============================================================
   PAGE ROUTING — kim ekanligi URL dan aniqlanadi
   ============================================================ */
function getPersonId() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('id')) return params.get('id');

  // filename dan: alisher_navoiy.html → alisher_navoiy
  const file = location.pathname.split('/').pop().replace('.html','');
  return file !== 'bobokalon_template' ? file : 'alisher_navoiy';
}

const personId = getPersonId();
const person = peopleData.find(p => p.id === personId) || peopleData[0];

/* ============================================================
   RENDER HERO
   ============================================================ */
function renderHero(p) {
  document.title = `${p.name} — BIU`;
  document.querySelector('meta[name="description"]').content = `${p.name} (${p.born}–${p.died}) haqida to'liq ma'lumot`;

  document.getElementById('heroBg').style.backgroundImage = `url('${p.image}')`;
  document.getElementById('heroEyebrow').textContent = `BIU · ${p.category.toUpperCase()}`;
  document.getElementById('heroName').textContent = p.name;
  document.getElementById('heroDates').textContent = `${p.born} — ${p.died}`;
  document.getElementById('chatTitle').textContent = `${p.name} bilan suhbat`;
  document.getElementById('pageTitle').textContent = `${p.name} — BIU`;

  const tagsEl = document.getElementById('heroTags');
  p.tags.forEach(t => {
    const s = document.createElement('span');
    s.className = 'hero-tag';
    s.textContent = t;
    tagsEl.appendChild(s);
  });

  const lifespan = p.died - p.born;
  const ago = new Date().getFullYear() - p.born;
  const statsEl = document.getElementById('heroStats');
  [
    { val: p.born, label: "Tug'ilgan yili" },
    { val: `${lifespan} yil`, label: "Umr ko'rdi" },
    { val: `${ago} yil`, label: "Bugun yoshi bo'lurdi" },
    { val: p.works?.length ?? '—', label: "Asarlar" }
  ].forEach(item => {
    const d = document.createElement('div');
    d.className = 'hero-stat';
    d.innerHTML = `<div class="hero-stat-val">${item.val}</div><div class="hero-stat-label">${item.label}</div>`;
    statsEl.appendChild(d);
  });
}

/* ============================================================
   RENDER BIO
   ============================================================ */
function renderBio(p) {
  const el = document.getElementById('bioText');
  el.innerHTML = (p.bio || []).map(para => `<p>${para}</p>`).join('');
}

/* ============================================================
   RENDER QUOTES
   ============================================================ */
function renderQuotes(p) {
  const grid = document.getElementById('quotesGrid');
  if (!p.quotes?.length) {
    document.getElementById('quotesSection').style.display = 'none';
    return;
  }
  p.quotes.forEach((q, i) => {
    const c = document.createElement('div');
    c.className = 'quote-card';
    c.style.animationDelay = `${i * 0.1}s`;
    c.innerHTML = `
      <div class="quote-text">${q.text}</div>
      <div class="quote-source">— ${q.source}</div>
    `;
    grid.appendChild(c);
  });
}

   RENDER WORKS
   ============================================================ */

  const grid = document.getElementById('worksGrid');
  if (!p.works?.length) {
    document.getElementById('worksSection').style.display = 'none';
    return;
  }
  const icons = { olim:'🔬', sarkarda:'⚔️', yozuvchi:'📜', din:'🕌' };
  const titleMap = { olim:'Ilmiy Asarlar va Kashfiyotlar', sarkarda:'Harbiy Yutuqlar va Obidalar',
                     yozuvchi:'Adabiy Asarlar', din:'Diniy Asarlar va Ta'limot' };
  document.getElementById('worksSectionTitle').textContent = titleMap[p.category] || 'Asarlar';

  p.works.forEach((w, i) => {
    const c = document.createElement('div');
    c.className = 'work-card';
    c.style.animationDelay = `${i * 0.08}s`;
    c.innerHTML = `
      <div class="work-icon">${w.icon || icons[p.category]}</div>
      <div class="work-title">${w.title}</div>
      <div class="work-year">📅 ${w.year}</div>
      <div class="work-desc">${w.desc}</div>
    `;
    grid.appendChild(c);
  });
}

/* ============================================================
   RENDER TIMELINE
   ============================================================ */
function renderTimeline(p) {
  const wrap = document.getElementById('timelineWrap');
  if (!p.timeline?.length) { wrap.innerHTML = '<p style="color:var(--muted)">Ma'lumot yo'q.</p>'; return; }

  p.timeline.forEach((ev, i) => {
    const item = document.createElement('div');
    item.className = 'tl-item';
    item.style.animationDelay = `${i * 0.1}s`;
    item.innerHTML = `
      <div class="tl-dot"></div>
      <div class="tl-year">${ev.year}</div>
      <div class="tl-box">
        <div class="tl-event">${ev.event}</div>
        <div class="tl-detail">${ev.detail}</div>
      </div>
    `;
    wrap.appendChild(item);
  });
}

/* ============================================================
   RENDER RELATED
   ============================================================ */
function renderRelated(p) {
  const grid = document.getElementById('relatedGrid');
  const ids = p.relatedIds || [];
  const related = peopleData.filter(x => ids.includes(x.id) && x.id !== p.id).slice(0, 6);

  if (!related.length) {
    document.getElementById('relatedSection').style.display = 'none';
    return;
  }

  related.forEach(r => {
    const link = document.createElement('a');
    link.className = 'rel-card';
    link.href = `${r.id}.html`;
    link.innerHTML = `
      <img src="${r.image}" alt="${r.name}" loading="lazy">
      <div class="rel-info">
        <div class="rel-name">${r.name}</div>
        <div class="rel-cat">${r.category}</div>
      </div>
    `;
    grid.appendChild(link);
  });
}

/* ============================================================
   AI CHATBOT
   ============================================================ */
const QUICK_PROMPTS = [
  "Kim edi u?",
  "Asosiy asarlari",
  "Qachon yashagan?",
  "Muhim kashfiyotlari",
  "Uning hikmatlaridan biri"
];

let chatHistory = [];
let isTyping = false;

function buildSystemPrompt(p) {
  return `Siz ${p.name} haqida ma'lumot beradigan AI yordamchisisiz. Foydalanuvchi savol bersa, faqat ${p.name} haqida qisqa, aniq, va mazmunli javob bering. Javoblar o'zbek tilida bo'lsin. Asosiy faktlar: tug'ilgan yili ${p.born}, vafoti ${p.died}, kategoriyasi: ${p.category}. Asarlari: ${(p.works||[]).map(w=>w.title).join(', ')}. Bio: ${(p.bio||[]).join(' ')} Agar savol boshqa mavzuda bo'lsa, muloyimlik bilan faqat ${p.name} haqida so'rang deb ayting. Javoblar 3–5 jumladan oshmasin.`;
}

function addMessage(role, text) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg msg-${role}`;

  const now = new Date();
  const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

  div.innerHTML = `
    <div class="msg-bubble">${text}</div>
    <div class="msg-time">${time}</div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function addTypingIndicator() {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg msg-bot msg-typing';
  div.id = 'typingIndicator';
  div.innerHTML = `<div class="msg-bubble"><div class="dot-typing"></div><div class="dot-typing"></div><div class="dot-typing"></div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage(text) {
  if (!text.trim() || isTyping) return;
  isTyping = true;

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  addMessage('user', text);
  chatHistory.push({ role: 'user', content: text });
  addTypingIndicator();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: buildSystemPrompt(person),
        messages: chatHistory
      })
    });

    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Kechirasiz, javob olishda muammo yuz berdi.';

    removeTypingIndicator();
    addMessage('bot', reply);
    chatHistory.push({ role: 'assistant', content: reply });

  } catch (err) {
    removeTypingIndicator();
    addMessage('bot', 'Tarmoq xatosi yuz berdi. Iltimos, qayta urinib ko'ring.');
  }

  isTyping = false;
  sendBtn.disabled = false;
}

function initChat(p) {
  // Welcome message
  addMessage('bot', `Assalomu alaykum! Men ${p.name} (${p.born}–${p.died}) haqida savollarga javob beraman. Nimani bilmoqchisiz? 😊`);

  // Quick prompts
  const qpEl = document.getElementById('quickPrompts');
  QUICK_PROMPTS.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'qp-btn';
    btn.textContent = q;
    btn.onclick = () => {
      document.getElementById('chatInput').value = q;
      sendChat();
    };
    qpEl.appendChild(btn);
  });

  // Send button
  document.getElementById('sendBtn').onclick = sendChat;

  // Enter key
  document.getElementById('chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });

  // Auto-resize textarea
  document.getElementById('chatInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 130) + 'px';
  });
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  sendMessage(text);
}

/* ============================================================
   SCROLL UTILITIES
   ============================================================ */
window.addEventListener('scroll', () => {
  const btn = document.getElementById('topBtn');
  btn.classList.toggle('show', window.scrollY > 400);
});

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  renderHero(person);
  renderBio(person);
  renderQuotes(person);
  renderWorks(person);
  renderTimeline(person);
  renderRelated(person);
  initChat(person);
});
</script>
