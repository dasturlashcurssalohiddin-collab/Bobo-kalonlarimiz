<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Ariza Formasi</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    /* Rang-barang gradient o'rniga professional och rang */
    background-color: #f4f7f6;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: #ffffff;
    padding: 40px 35px;
    border-radius: 12px; /* Burchaklarni biroz o'tkirroq qildik */
    width: 100%;
    max-width: 400px; /* Sign in uchun kichikroq hajm mosroq */
    box-shadow: 0 10px 25px rgba(0,0,0,0.05); /* Soya ancha yumshatildi */
    border: 1px solid #e1e4e8;
}

h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #1a202c;
    font-size: 24px;
    font-weight: 700;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 8px;
    font-weight: 600;
    color: #4a5568;
    font-size: 14px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 5px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    font-size: 15px;
    transition: all 0.2s ease-in-out;
    box-sizing: border-box; /* Padding masalasini to'g'irlaydi */
}

input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.submit-btn {
    background-color: #2563eb; /* Professional ko'k rang */
    color: white;
}

.submit-btn:hover {
    background-color: #1d4ed8;
}

.submit-btn:disabled {
    background-color: #93c5fd;
    cursor: not-allowed;
}

.delete-btn {
    background-color: transparent;
    color: #6b7280;
    margin-top: 15px;
    font-size: 14px;
    text-decoration: underline;
}

.delete-btn:hover {
    color: #ef4444;
}

.error {
    color: #dc2626;
    font-size: 12px;
    margin-top: 4px;
}

.success {
    color: #059669;
    text-align: center;
    font-weight: 500;
    margin-top: 15px;
}

.user-info {
    background: #f8fafc;
    padding: 12px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #64748b;
}
</style>
</head>
<body>

<div class="container">
    <h2>Ariza Formasi</h2>
    
    <div id="gSignIn"></div>
    
    <div id="userInfo" class="user-info" style="display:none;">
        <strong>Salom, <span id="userName"></span>!</strong>
    </div>

    <form id="form" style="display:none;">
        <label>F.I.SH:</label>
        <input type="text" id="name" placeholder="Ism Familiya">
        <div id="nameError" class="error"></div>

        <label>Email:</label>
        <input type="email" id="email" readonly>

        <label>Telefon:</label>
        <input type="text" id="phone" placeholder="901234567">
        <div id="phoneError" class="error"></div>

        <label>Qo'shimcha ma'lumot:</label>
        <textarea id="extra" placeholder="Istalgan qo'shimcha ma'lumot"></textarea>

        <button type="submit" class="submit-btn" id="submitBtn">Yuborish</button>
        <div id="loading" class="loading">⏳ Jo'natilmoqda...</div>
        <div id="success" class="success"></div>
    </form>

    <button id="deleteBtn" class="delete-btn" style="display:none;" onclick="clearData()">O'chirish</button>
</div>

<script>
const CLIENT_ID = "318653553640-uv3r040c4im18no4mjeq8eeomj24b1o8.apps.googleusercontent.com";
const TELEGRAM_BOT_TOKEN = "7123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefgh";
const TELEGRAM_CHAT_ID = "123456789";
const API_ENDPOINT = "https://bobokalonlar-insoniyat-utozlari-biu.onrender.com/api/send-form";

const form = document.getElementById("form");
const userInfo = document.getElementById("userInfo");
const userName = document.getElementById("userName");
const deleteBtn = document.getElementById("deleteBtn");
const submitBtn = document.getElementById("submitBtn");

function handleCredentialResponse(res) {
    const data = jwt_decode(res.credential);
    localStorage.setItem("userName", data.name);
    localStorage.setItem("userEmail", data.email);
    
    showForm(data.name, data.email);
}

function showForm(name, email) {
    userInfo.style.display = "block";
    userName.innerText = name;
    deleteBtn.style.display = "block";
    form.style.display = "block";
    document.getElementById("email").value = email;
    
    document.getElementById("name").value = localStorage.getItem("formName") || "";
    document.getElementById("phone").value = localStorage.getItem("formPhone") || "";
    document.getElementById("extra").value = localStorage.getItem("formExtra") || "";
}

window.onload = () => {
    google.accounts.id.initialize({ 
        client_id: CLIENT_ID, 
        callback: handleCredentialResponse 
    });
    google.accounts.id.renderButton(
        document.getElementById("gSignIn"), 
        { size: "large" }
    );

    const nameSaved = localStorage.getItem("userName");
    const emailSaved = localStorage.getItem("userEmail");

    if (nameSaved && emailSaved) {
        showForm(nameSaved, emailSaved);
    }
};

function validate(data) {
    let ok = true;
    document.querySelectorAll(".error").forEach(el => el.innerText = "");
    
    if (!/^[A-Za-z\s]{3,}$/.test(data.name)) {
        document.getElementById("nameError").innerText = "✗ Ism noto'g'ri (minimum 3 ta harf)";
        ok = false;
    }
    if (!/^[0-9]{9}$/.test(data.phone)) {
        document.getElementById("phoneError").innerText = "✗ Telefon noto'g'ri (9 raqam)";
        ok = false;
    }
    return ok;
}

async function sendToTelegram(data) {
    const message = `
📋 *Yangi Ariza*
👤 *F.I.Sh:* ${data.name}
📧 *Email:* ${data.email}
📱 *Telefon:* ${data.phone}
ℹ️ *Ma'lumot:* ${data.extra || "Yo'q"}
⏰ *Vaqt:* ${new Date().toLocaleString()}
    `;

    try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: "Markdown"
            })
        });
    } catch (err) {
        console.error("Telegram xatosi:", err);
    }
}

form.addEventListener("submit", async function(e) {
    e.preventDefault();
    
    const data = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        extra: document.getElementById("extra").value.trim()
    };

    if (!validate(data)) {
        alert("❌ Formada xatolik bor!");
        return;
    }

    document.getElementById("loading").style.display = "block";
    submitBtn.disabled = true;

    try {
        const response = await fetch(API_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        console.log('📥 Server javob:', response.status);
        
        const result = await response.json();
        console.log('📦 JSON:', result);

        if (response.ok && result.success) {
            localStorage.setItem("formName", data.name);
            localStorage.setItem("formPhone", data.phone);
            localStorage.setItem("formExtra", data.extra);

            await sendToTelegram(data);
            
            setTimeout(() => {
                window.location.href = "bobo-kalonlar.html";
            }, 1500);
        } else {
            alert("❌ Xatolik: " + (result.error || "Noma'lum xatolik"));
            document.getElementById("loading").style.display = "none";
            submitBtn.disabled = false;
        }
    } catch (err) {
        console.error('❌ Catch xatolik:', err);
        alert("❌ Xatolik: " + err.message);
        document.getElementById("loading").style.display = "none";
        submitBtn.disabled = false;
    }
});

function clearData() {
    if (confirm("Barcha ma'lumotlar o'chirilsinmi?")) {
        localStorage.clear();
        location.reload();
    }
}
</script>
</body>
</html>
