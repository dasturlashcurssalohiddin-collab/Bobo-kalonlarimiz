<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Ariza Formasi</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
<style>
body {font-family:sans-serif; background:#f0f0f0; display:flex; justify-content:center; align-items:center; height:100vh;}
.container {background:#fff; padding:30px; border-radius:15px; width:400px; box-shadow:0 5px 20px rgba(0,0,0,0.2);}
input, textarea, button {width:100%; padding:10px; margin:10px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box;}
button {background:#667eea; color:white; border:none; cursor:pointer;}
button:hover {background:#5a67d8;}
</style>
</head>
<body>
<div class="container">
<h2>Ariza Formasi</h2>

<div id="gSignIn"></div>

<form id="form" style="display:none;" onsubmit="submitForm(event)">
  <input type="text" id="name" placeholder="F.I.SH" required>
  <input type="text" id="email" placeholder="Email" readonly required>
  <input type="text" id="phone" placeholder="Telefon">
  <textarea id="extra" placeholder="Qo‘shimcha ma’lumot"></textarea>
  <button type="submit">Yuborish</button>
</form>

<div id="success" style="color:green;"></div>
</div>

<script>
const CLIENT_ID = "318653553640-uv3r040c4im18no4mjeq8eeomj24b1o8.apps.googleusercontent.com";

function handleCredentialResponse(res){
    const data = jwt_decode(res.credential);
    document.getElementById("form").style.display="block";
    document.getElementById("email").value = data.email;
    document.getElementById("name").value = data.name;
}

window.onload = () => {
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleCredentialResponse });
    google.accounts.id.renderButton(document.getElementById("gSignIn"), { size: "large" });
};

async function submitForm(e){
    e.preventDefault();
    const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        extra: document.getElementById("extra").value
    };

    try {
        const res = await fetch("http://localhost:3000/submit", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if(data.success){
            document.getElementById("success").innerText="Ariza muvaffaqiyatli yuborildi!";
            setTimeout(()=>{ window.location.href="bobo-kalonlar.html"; },1500);
        }
    } catch(err){
        alert("Xatolik yuz berdi!");
    }
}
</script>
</body>
</html>
